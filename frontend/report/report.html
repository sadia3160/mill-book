<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MillBook Report</title>
    <link rel="stylesheet" href="reportstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spinnaker&display=swap" rel="stylesheet">
</head>

<body>

    <div id="report-hero">
        <h2>Report</h2>
    </div>

    <nav>
      <ul class="nav-bar">
        <li><a href='../home/home.html'>Home</a></li>
        <li><a href='../purchase/purchase.html'>Purchases</a></li>
        <li><a href='../milling/milling.html'>Milling</a></li>
        <li><a href='../sales/sales.html'>Sales</a></li>
        <li><a href='../report/report.html'>Report</a></li>
      </ul>
    </nav>

    <form id="reportForm">
      <input type="number" min="0" max="31" id="day-report" name="day-report" placeholder="Enter date">
      <input type="number" min="0" max="12" id="month-report" name="month-report" placeholder="Enter month no">  
      <input type="number" min="2000" id="year-report" name="year-report" placeholder="Enter year">
      <button type="submit" id="btn-form">Submit</button>
    </form>

    <div id="report-table-container">
        <h2 id="range"> </h2>
        <table>

            <thead>

                <tr>
                    <th>Paid Purchases</th>      
                    <th>Due Purchases</th>
                     <th>Paid Sales</th> 
                    <th>Due Sales</th>
                    
                </tr>

            </thead>

            <tbody id="reportTable">

            </tbody>

        </table>
    </div>
        
    <script type="module" src="report.js"></script>
</body>
</html>
