<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MillBook Profile</title>
    <link rel="stylesheet" href="profilestyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spinnaker&display=swap" rel="stylesheet">
</head>

<body>

    <div class="hero">
      <div class="title-bar">
        <h1 id="shop-name"><a href="../home/home.html">MillBook</a></h1> 
        <a href="../profile/profile.html">
            <img alt="shop-icon" id="profile-avatar" src="../assets/retail_by_uniconlabs_flaticon.png">
        </a>
      </div>

      <a href="../supplier/supplier.html" id="supplier-link">
        <div id="supplier">
          <img alt="supplier-info-button" id="supplier-avatar" src="../assets/avatar_by_luch_phou_faticon.png">
          <h4>Supplier Info</h4>
        </div>
      </a>

    </div>

    <nav>
      <ul class="nav-bar">
        <li><a href='../home/home.html'>Home</a></li>
        <li><a href='../purchase/purchase.html'>Purchases</a></li>
        <li><a href='../milling/milling.html'>Milling</a></li>
        <li><a href='../sales/sales.html'>Sales</a></li>
        <li><a href='../report/report.html'>Report</a></li>
      </ul>
    </nav>

    

    <div id="profile-container">
        <h1>Update Profile</h1>
        <form id="profileForm">
            <div id="profile-content">
                <input type="text" id="shopEmail" placeholder="Email" required>
                <input type="password" id="shopPassword" placeholder="Current Password" required>
                <input type="password" id="newShopPassword" placeholder="New Password" required>
            </div>
            <button id="profile-submit" type="submit">Submit</button>
        </form>
        <p id="message"></p>
    </div>

    

    <h3>OR,</h3>
    <button id="logout">Log Out</button>
    
    <script type="module" src="profile.js"></script>
</body>
</html>
