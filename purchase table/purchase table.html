<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purchase Information</title>

    <link rel="stylesheet" href="purchasetable.css">
</head>

<body>

    <div class="container">

    
        <h2>Purchase information</h2>

        <!-- Purchase Form -->

        <div class="form-box">

            <form id="purchaseForm">

                <div class="form-group">
                    <label>Purchase Date</label>
                    <input type="date" id="purchaseDate" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <input type="text"
                           id="description"
                           placeholder="Enter description"
                           required>
                </div>

                <div class="form-group">
                    <label>Quantity (KG)</label>
                    <input type="number"
                           id="quantity"
                           placeholder="Enter quantity"
                           min="1"
                           required>
                </div>

                <div class="form-group">
                    <label>Unit Price (৳)</label>
                    <input type="number"
                           id="unitPrice"
                           placeholder="Enter unit price"
                           min="0"
                           required>
                </div>

                <div class="form-group">
                    <label>Total Purchase Cost (৳)</label>
                    <input type="number"
                           id="totalCost"
                           readonly>
                </div>

                <div class="form-group">
                    <label>Supplier</label>
                    <input type="text"
                           id="supplier"
                           placeholder="Enter supplier name"
                           required>
                </div>

                <div class="form-group">
                    <label>On Account</label>

                    <select id="onAccount">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Paid Amount (৳)</label>
                    <input type="number"
                           id="paidAmount"
                           placeholder="Enter paid amount"
                           min="0"
                           required>
                </div>

                <div class="form-group">
                    <label>Due Amount (৳)</label>
                    <input type="number"
                           id="dueAmount"
                           readonly>
                </div>

                <div class="button-area">

                    <button type="submit" class="add-btn">
                        + Add Purchase
                    </button>

                    <button type="reset" class="clear-btn">
                        Clear
                    </button>

                </div>

            </form>

        </div>


        <!-- Purchase List -->

        <div class="table-box">

            <div class="table-header">

                <h2>Purchase List</h2>

                <input type="text"
                       id="searchPurchase"
                       placeholder="Search purchase...">

            </div>


            <table>

                <thead>

                    <tr>
                        <th>SL</th>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Total Cost</th>
                        <th>Supplier</th>
                        <th>On Account</th>
                        <th>Paid</th>
                        <th>Due</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="purchaseTable">

                </tbody>

            </table>

        </div>

    </div>


    <script src="purchase.js"></script>

</body>

</html>
